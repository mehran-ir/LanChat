name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller pillow comtypes pystray

      - name: Read app version
        id: appver
        shell: bash
        run: echo "version=$(python -c 'from version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name "LanChat by MGH v${{ steps.appver.outputs.version }}" --hidden-import=PIL._tkinter_finder --collect-submodules comtypes --hidden-import=pystray._win32 main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LanChat-by-MGH-v${{ steps.appver.outputs.version }}-windows-exe
          path: "dist/LanChat by MGH v${{ steps.appver.outputs.version }}.exe"
